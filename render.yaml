services:
  - type: web
    name: snapmind
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_MODE
        value: cloud
      - key: STORAGE_PROVIDER
        value: supabase
      - key: AI_PROVIDER
        value: gemini
      - key: STATIC_DIR
        value: /code/static
      - key: SUPABASE_BUCKET
        value: screenshots
      - key: GEMINI_VISION_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-2
      - key: GEMINI_EMBED_DIMENSIONS
        value: "768"
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
