services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snapmind
      POSTGRES_PASSWORD: snapmind
      POSTGRES_DB: snapmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapmind"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      EMBED_MODEL: nomic-embed-text
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3-vl:2b
      EMBED_MODEL: nomic-embed-text
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/data/uploads
    depends_on:
      - api
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads: